<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今晚誰買單 - 命運轉盤</title>
    <style>
        :root {
            --bg-color: #E0F7FA; /* 清涼淺水藍背景 */
            --text-color: #01579B; /* 深海藍文字 */
            --btn-color: #0288D1;
            --btn-hover: #0277BD;
            --panel-bg: #FFFFFF;
            --border-color: #B3E5FC;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, '微軟正黑體', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-top: 30px;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 2px;
        }
        .input-section {
            width: 100%;
            background: var(--panel-bg);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,100,150,0.05);
            margin-bottom: 30px;
            box-sizing: border-box;
        }
        textarea {
            width: 100%;
            height: 90px;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            box-sizing: border-box;
            outline: none;
            color: var(--text-color);
            background: #FAFAFA;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: #4FC3F7;
            background: #FFFFFF;
        }
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin-bottom: 40px;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,100,150,0.1);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 30px solid #FF7043; /* 醒目的暖色指標 */
            z-index: 10;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1));
        }
        .btn {
            background-color: var(--btn-color);
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 6px 15px rgba(2, 136, 209, 0.3);
            letter-spacing: 1px;
        }
        .btn:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(2, 136, 209, 0.4);
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(2, 136, 209, 0.3);
        }
        .btn:disabled {
            background-color: #B0BEC5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* Modal 特效 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 30, 60, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 100;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal-content {
            background: white;
            padding: 50px 40px;
            border-radius: 40px;
            text-align: center;
            transform: scale(0.7) translateY(20px);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 85%;
            width: 350px;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }
        .modal-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #546E7A;
            font-weight: normal;
        }
        .modal-winner {
            font-size: 42px;
            font-weight: 900;
            color: var(--btn-color);
            margin-bottom: 35px;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>今晚誰買單</h1>
    
    <div class="input-section">
        <textarea id="namesInput" placeholder="請輸入名字，用逗號或換行分隔">海綿寶寶, 派大星, 章魚哥, 蟹老闆, 珊迪, 小蝸</textarea>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="800" height="800"></canvas>
    </div>

    <button id="spinBtn" class="btn">開始轉動</button>
</div>

<div class="modal-overlay" id="resultModal">
    <div class="modal-content">
        <div class="modal-title">今天的金主是...</div>
        <div class="modal-winner" id="winnerText">XXX</div>
        <button class="btn" id="closeBtn" style="font-size: 18px; padding: 12px 30px;">再玩一次</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const namesInput = document.getElementById('namesInput');
    const spinBtn = document.getElementById('spinBtn');
    const resultModal = document.getElementById('resultModal');
    const winnerText = document.getElementById('winnerText');
    const closeBtn = document.getElementById('closeBtn');

    // 配色：寶寶藍、浪花白、淺灰藍、薄荷水綠
    const colors = ['#B3E5FC', '#FFFFFF', '#B2DFDB', '#81D4FA', '#E0F2F1'];
    
    let segments = [];
    let currentAngle = 0;
    let isSpinning = false;
    let spinVelocity = 0;
    let animationId;

    // 解析輸入的人名
    function updateSegments() {
        const text = namesInput.value;
        const names = text.split(/,|\n/).map(n => n.trim()).filter(n => n);
        segments = names.length > 0 ? names : ['請輸入名字'];
    }

    // 畫轉盤
    function drawWheel() {
        const numSegments = segments.length;
        const anglePerSegment = (Math.PI * 2) / numSegments;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = canvas.width / 2;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < numSegments; i++) {
            const startAngle = currentAngle + i * anglePerSegment;
            const endAngle = startAngle + anglePerSegment;

            // 畫扇形
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.fillStyle = colors[i % colors.length];
            ctx.fill();
            
            // 畫邊界線 
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#E0F7FA';
            ctx.stroke();

            // 畫文字
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(startAngle + anglePerSegment / 2);
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#01579B'; // 深海藍文字
            
            // 根據字數調整字體大小
            const fontSize = segments[i].length > 4 ? 30 : 40;
            ctx.font = `bold ${fontSize}px "微軟正黑體", sans-serif`;
            
            // 將文字向內推一點避免切到邊緣
            ctx.fillText(segments[i], radius - 40, 0);
            ctx.restore();
        }
        
        // 畫中心裝飾圓
        ctx.beginPath();
        ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#0288D1';
        ctx.stroke();
    }

    // 旋轉動畫
    function animate() {
        if (spinVelocity > 0) {
            currentAngle += spinVelocity;
            spinVelocity *= 0.985; // 物理減速摩擦力

            // 速度低於閾值即停止
            if (spinVelocity < 0.002) {
                spinVelocity = 0;
                isSpinning = false;
                spinBtn.disabled = false;
                namesInput.disabled = false;
                showWinner();
                return;
            }

            drawWheel();
            animationId = requestAnimationFrame(animate);
        }
    }

    // 開始轉動事件
    spinBtn.addEventListener('click', () => {
        if (isSpinning) return;
        
        updateSegments();
        if (segments.length <= 1) {
            alert('請至少輸入兩個人名，這樣才能抽呀！');
            return;
        }

        isSpinning = true;
        spinBtn.disabled = true;
        namesInput.disabled = true;

        // 給予隨機的初始旋轉速度 (確保每次停下的位置隨機)
        spinVelocity = 0.35 + Math.random() * 0.25; 
        
        animate();
    });

    // 顯示中獎者
    function showWinner() {
        const numSegments = segments.length;
        const anglePerSegment = (Math.PI * 2) / numSegments;
        
        // 轉盤正上方角度為 270度 (1.5 * Math.PI)
        let normalizedAngle = currentAngle % (Math.PI * 2);
        if (normalizedAngle < 0) normalizedAngle += Math.PI * 2;
        
        const pointerAngle = (Math.PI * 1.5 - normalizedAngle + Math.PI * 2) % (Math.PI * 2);
        const winningIndex = Math.floor(pointerAngle / anglePerSegment);
        
        winnerText.innerText = segments[winningIndex];
        resultModal.classList.add('active');
    }

    // 關閉 Modal
    closeBtn.addEventListener('click', () => {
        resultModal.classList.remove('active');
    });

    // 輸入框內容改變時即時更新轉盤
    namesInput.addEventListener('input', () => {
        if (!isSpinning) {
            updateSegments();
            drawWheel();
        }
    });

    // 頁面載入初始化
    updateSegments();
    drawWheel();
</script>
</body>
</html>
